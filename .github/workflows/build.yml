name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The GitHub-hosted Ubuntu image ships with an Android SDK, so no third-party
# setup action is needed (setup-android@v3 used to fail while downloading the
# command line tools). CI only verifies that the sources build; the installable
# APK attached to a Release is built and signed by the maintainer, because a
# CI-generated debug keystore would produce a different signature every run.
jobs:
  native:
    name: compile native binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: install NDK
        run: yes | sdkmanager --install "ndk;26.3.11579264" > /dev/null
      - name: build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          OUT_DIR: ${{ runner.temp }}/native-out
        run: bash scripts/build-native.sh
      - name: verify binaries
        run: find "${{ runner.temp }}/native-out" -type f -name uinput_x360 -printf '%s %p\n'

  apk:
    name: build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: install SDK components
        run: yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: assemble release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ControllerStarRail-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
