name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: compile native binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: install NDK
        run: sdkmanager --install "ndk;26.3.11579264"
      - name: build all ABIs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          OUT_DIR: ${{ runner.temp }}/native-out
        run: bash scripts/build-native.sh
      - name: verify binaries
        run: find "${{ runner.temp }}/native-out" -type f -name uinput_x360 -printf '%s %p\n'

  apk:
    name: build release APK
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: assemble release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ControllerStarRail-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: attach APK to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ControllerStarRail-apk
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
