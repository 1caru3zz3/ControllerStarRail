plugins {
    id 'com.android.application'
}

android {
    namespace 'com.controllerstar.x360bridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.controllerstar.x360bridge'
        minSdk 24
        targetSdk 33
        versionCode 7
        versionName '0.4.0'
    }

    sourceSets {
        main {
            aidl.srcDirs = ['src/main/aidl']
            assets.srcDirs = ['src/main/assets']
        }
    }

    signingConfigs {
        debug {
            /* Reuse the project's fixed debug keystore when CSR_DEBUG_KEYSTORE is
             * set, so locally built release APKs stay installable over earlier
             * versions. CI leaves the variable unset and gets Gradle's default
             * debug key, which is fine for build verification only. */
            def compatStore = System.getenv('CSR_DEBUG_KEYSTORE')
            if (compatStore && file(compatStore).exists()) {
                storeFile file(compatStore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
