name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI only verifies that the sources build. The installable APK attached to a
# Release is built and signed by the maintainer with a fixed debug key, because
# a CI-generated debug keystore differs on every run and cannot be installed
# as an update.
jobs:
  native:
    name: compile native binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: prepare Android SDK tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BIN=$(find "$SDK" -type f -name sdkmanager -printf '%h\n' 2>/dev/null | head -1 || true)
          if [ -z "$BIN" ]; then
            echo "sdkmanager missing, installing Android command line tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools"
            unzip -q -o /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            BIN="$SDK/cmdline-tools/latest/bin"
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          echo "using sdkmanager from $BIN"
      - name: accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: install NDK
        run: sdkmanager --install "ndk;26.3.11579264"
      - name: build all ABIs
        env:
          OUT_DIR: ${{ runner.temp }}/native-out
        run: |
          # ANDROID_HOME comes from the runner image, not the workflow env context.
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/26.3.11579264"
          bash scripts/build-native.sh
      - name: verify binaries
        run: find "${{ runner.temp }}/native-out" -type f -name uinput_x360 -printf '%s %p\n'

  apk:
    name: build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: prepare Android SDK tools
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BIN=$(find "$SDK" -type f -name sdkmanager -printf '%h\n' 2>/dev/null | head -1 || true)
          if [ -z "$BIN" ]; then
            echo "sdkmanager missing, installing Android command line tools"
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$SDK/cmdline-tools"
            unzip -q -o /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            BIN="$SDK/cmdline-tools/latest/bin"
          fi
          echo "$BIN" >> "$GITHUB_PATH"
          echo "using sdkmanager from $BIN"
      - name: accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
      - name: install SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: assemble release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: ControllerStarRail-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
